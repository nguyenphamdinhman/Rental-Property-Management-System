<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glass · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="design-system.css" />
<style>
  html, body, #root { height: 100%; margin: 0; overflow: hidden; }
  body { background: #f7f7fb; color: #0f172a; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="lib/tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="customer.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const [tweaks, setTweak] = useTweaks({ active: 'dashboard' });
  const setActive = (k) => setTweak('active', k);
  const active = tweaks.active;

  let body;
  if (active === 'dashboard') body = <AdminDashboard setActive={setActive} />;
  if (active === 'rooms')     body = <AdminRooms     setActive={setActive} />;
  if (active === 'contracts') body = <AdminContracts setActive={setActive} />;
  if (active === 'invoices')  body = <AdminInvoices  setActive={setActive} />;
  if (active === 'tenants')   body = <AdminTenants   setActive={setActive} />;
  if (active === 'chat')      body = <AdminChat      setActive={setActive} />;
  if (active === 'ai')        body = <AdminAI        setActive={setActive} />;

  return (
    <div data-screen-label={`Admin · ${active}`} style={{ height: '100%' }}>
      {body}
      <TweaksPanel>
        <TweakSection title="Trang Admin">
          <TweakSelect
            value={active}
            onChange={setActive}
            options={[
              { value: 'dashboard', label: 'Tổng quan' },
              { value: 'rooms', label: 'Cơ sở & phòng' },
              { value: 'contracts', label: 'Hợp đồng' },
              { value: 'invoices', label: 'Hóa đơn' },
              { value: 'tenants', label: 'Khách thuê' },
              { value: 'chat', label: 'Hộp thư' },
              { value: 'ai', label: 'AI Assistant' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
